[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-learn-from-human"
version = "0.1.0"
description = "Learning dexterous WujiHand manipulation from human demonstrations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Wuji Technology Co., Ltd.", email = "support@wuji.tech" }]
dependencies = ["wuji-mjlab>=0.1.0", "numpy>=1.26", "scipy>=1.12", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
retarget = ["wuji-retargeting>=2026.8.17", "smplx>=0.1.28", "chumpy>=0.70"]

[project.entry-points."mjlab.tasks"]
wuji_lfh = "wuji_lfh.tasks"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wuji_lfh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
indent-width = 2
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Preserve the copied preprocessing/IK behavior; its array lengths are checked
# explicitly, and MANO compatibility aliases must precede the smplx import.
"src/wuji_lfh/retargeting/*.py" = ["B905"]
"src/wuji_lfh/retargeting/dexterhand.py" = ["E402", "B905"]

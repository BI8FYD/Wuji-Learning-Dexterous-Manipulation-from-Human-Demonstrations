[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-learn-from-human"
version = "0.1.0"
description = "Learning dexterous WujiHand manipulation from human demonstrations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Wuji Technology Co., Ltd.", email = "support@wuji.tech" }]
keywords = ["dexterous-manipulation", "human-demonstrations", "ik-retargeting", "reinforcement-learning", "sim-to-real", "wujihand"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wuji-export-reference = "wuji_learn_from_human.retargeting.cli:main"

[project.urls]
Homepage = "https://github.com/wuji-technology/wuji-learn-from-human"
Repository = "https://github.com/wuji-technology/wuji-learn-from-human"
Issues = "https://github.com/wuji-technology/wuji-learn-from-human/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
